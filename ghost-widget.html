<!-- PowerSocket Live NEM widget -->
<div id="nemlive" class="nemlive" data-src="https://raw.githubusercontent.com/YOUR-GITHUB-NAME/nem_live/data/public/"></div>

<style>
/* Colours are inherited from the surrounding page so this works on a light or dark theme. */
.nemlive{font-family:inherit;color:inherit;max-width:920px;margin:0 auto}
.nemlive .nl-controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.nemlive .nl-group{display:flex;flex-wrap:wrap;border:1px solid rgba(128,128,128,.4);border-radius:8px;overflow:hidden}
.nemlive button.nl-btn{border:0;border-right:1px solid rgba(128,128,128,.3);background:transparent;color:inherit;font:inherit;font-size:.9rem;padding:.45rem .9rem;cursor:pointer;opacity:.65}
.nemlive button.nl-btn:last-child{border-right:0}
.nemlive button.nl-btn.active{background:rgba(128,128,128,.22);font-weight:600;opacity:1}
.nemlive button.nl-btn[disabled]{opacity:.28;cursor:not-allowed}
.nemlive .nl-stats{display:flex;gap:2rem;flex-wrap:wrap;margin:1rem 0}
.nemlive .nl-stat{min-width:110px}
.nemlive .nl-stat .nl-label{font-size:.9rem;opacity:.6}
.nemlive .nl-stat .nl-value{font-size:1.5rem;font-weight:600;margin-top:.15rem}
.nemlive .nl-chart{width:100%;height:460px}
.nemlive .nl-meta{font-size:.75rem;opacity:.55;margin-top:.5rem}
.nemlive .nl-error{padding:2rem 1rem;text-align:center;border:1px solid rgba(200,80,80,.5);border-radius:8px;opacity:.9}
</style>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script>
(function () {
  var root = document.getElementById("nemlive");
  if (!root || !root.dataset.src) return;
  var dataSrc = root.dataset.src.replace(/\/?$/, "/");

  var REGIONS = [
    { key: "nem", label: "NEM" },
    { key: "nsw1", label: "NSW" },
    { key: "qld1", label: "QLD" },
    { key: "vic1", label: "VIC" },
    { key: "sa1", label: "SA" },
    { key: "tas1", label: "TAS" }
  ];
  var RANGES = [
    { key: "24h", label: "24 hours", hours: 24 },
    { key: "3d", label: "3 days", hours: 72 },
    { key: "7d", label: "7 days", hours: 168 }
  ];
  var RENEWABLE = ["Bioenergy", "Hydro", "Wind", "Solar (utility)", "Solar (rooftop)"];
  var SUPPLY_COLOR = "#2F9E7E";
  var PRICE_COLOR = "#E8553F";

  var state = { region: "nem", range: "24h", mix: false, cache: {} };

  root.innerHTML =
    '<div class="nl-controls">' +
    '<div class="nl-group" data-role="regions"></div>' +
    '<div class="nl-group" data-role="ranges"></div>' +
    '<div class="nl-group" data-role="mix"></div>' +
    "</div>" +
    '<div class="nl-stats" data-role="stats"></div>' +
    '<div class="nl-chart" data-role="chart"></div>' +
    '<div class="nl-meta" data-role="meta"></div>';

  var regionsEl = root.querySelector('[data-role="regions"]');
  var rangesEl = root.querySelector('[data-role="ranges"]');
  var mixEl = root.querySelector('[data-role="mix"]');
  var statsEl = root.querySelector('[data-role="stats"]');
  var chartEl = root.querySelector('[data-role="chart"]');
  var metaEl = root.querySelector('[data-role="meta"]');

  function addButtons(group, items, isActive, onPick) {
    items.forEach(function (item) {
      var b = document.createElement("button");
      b.className = "nl-btn" + (isActive(item) ? " active" : "");
      b.textContent = item.label;
      b.addEventListener("click", function () {
        onPick(item);
        Array.prototype.forEach.call(group.children, function (el) {
          el.classList.toggle("active", el === b);
        });
        render();
      });
      group.appendChild(b);
    });
  }

  addButtons(regionsEl, REGIONS, function (r) { return r.key === state.region; },
    function (r) { state.region = r.key; });
  addButtons(rangesEl, RANGES, function (r) { return r.key === state.range; },
    function (r) { state.range = r.key; });

  var mixBtn = document.createElement("button");
  mixBtn.className = "nl-btn";
  mixBtn.textContent = "Energy mix";
  mixBtn.addEventListener("click", function () {
    if (mixBtn.disabled) return;
    state.mix = !state.mix;
    mixBtn.classList.toggle("active", state.mix);
    render();
  });
  mixEl.appendChild(mixBtn);

  function showError(message) {
    chartEl.innerHTML = '<div class="nl-error">' + message + "</div>";
    statsEl.innerHTML = "";
    metaEl.textContent = "";
  }

  function fetchRegion(key) {
    if (state.cache[key]) return Promise.resolve(state.cache[key]);
    return fetch(dataSrc + key + ".json", { cache: "no-store" }).then(function (resp) {
      if (!resp.ok) throw new Error("status " + resp.status);
      return resp.json();
    }).then(function (json) {
      state.cache[key] = json;
      return json;
    });
  }

  function lastValid(arr) {
    if (!arr) return null;
    for (var i = arr.length - 1; i >= 0; i--) {
      if (arr[i] !== null && arr[i] !== undefined) return arr[i];
    }
    return null;
  }

  function render() {
    fetchRegion(state.region)
      .then(renderChart)
      .catch(function () {
        showError("Live data is unavailable right now.");
      });
  }

  function renderChart(data) {
    var range = RANGES.filter(function (r) { return r.key === state.range; })[0];
    var perHour = 60 / (data.interval_minutes || 5);
    var n = Math.min(data.t.length, Math.round(range.hours * perHour));
    var start = data.t.length - n;
    var t = data.t.slice(start);

    var fuels = data.fuels || [];
    mixBtn.disabled = fuels.length === 0;
    mixBtn.title = fuels.length ? "" : "Fuel mix data is not available yet";
    if (mixBtn.disabled) {
      state.mix = false;
      mixBtn.classList.remove("active");
    }

    var fg = getComputedStyle(root).color;
    var grid = "rgba(128,128,128,0.25)";
    var traces = [];

    // Stack first so the supply/demand lines draw on top of it.
    if (state.mix) {
      fuels.forEach(function (f) {
        traces.push({
          x: t,
          y: data.series[f.name].slice(start),
          name: f.name,
          stackgroup: "mix",
          mode: "lines",
          line: { width: 0, color: f.color },
          fillcolor: f.color,
          hoverinfo: "x+y+name"
        });
      });
    }

    if (data.supply) {
      traces.push({
        x: t,
        y: data.supply.slice(start),
        name: "Supply",
        mode: "lines",
        line: { width: 2, color: SUPPLY_COLOR },
        hoverinfo: "x+y+name"
      });
    }
    traces.push({
      x: t,
      y: data.demand.slice(start),
      name: "Demand",
      mode: "lines",
      line: { width: 2, color: fg, dash: "dot" },
      hoverinfo: "x+y+name"
    });
    traces.push({
      x: t,
      y: data.price.slice(start),
      name: "Price",
      mode: "lines",
      yaxis: "y2",
      line: { width: 1.5, color: PRICE_COLOR },
      hoverinfo: "x+y+name"
    });

    Plotly.newPlot(
      chartEl,
      traces,
      {
        margin: { t: 20, r: 58, b: 40, l: 58 },
        showlegend: true,
        legend: { orientation: "h", y: -0.15 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: fg },
        xaxis: { type: "date", gridcolor: grid, zerolinecolor: grid },
        // The stack has to sit on a zero baseline; the plain lines read better auto-scaled.
        yaxis: { title: "MW", gridcolor: grid, zerolinecolor: grid, rangemode: state.mix ? "tozero" : "normal" },
        yaxis2: { title: "$/MWh", overlaying: "y", side: "right", showgrid: false },
        hovermode: "x unified"
      },
      { responsive: true, displayModeBar: false }
    );

    var lastDemand = lastValid(data.demand);
    var lastSupply = lastValid(data.supply);
    var lastPrice = lastValid(data.price);
    var renewableTotal = RENEWABLE.reduce(function (sum, name) {
      return sum + (data.series[name] ? lastValid(data.series[name]) || 0 : 0);
    }, 0);

    var html =
      stat("Price now", lastPrice !== null ? "$" + lastPrice.toFixed(0) + "/MWh" : "\u2013") +
      stat("Demand now", lastDemand !== null ? Math.round(lastDemand).toLocaleString() + " MW" : "\u2013") +
      stat("Supply now", lastSupply !== null ? Math.round(lastSupply).toLocaleString() + " MW" : "\u2013");
    if (fuels.length && lastDemand) {
      html += stat("Renewables now", ((100 * renewableTotal) / lastDemand).toFixed(0) + "%");
    }
    statsEl.innerHTML = html;

    metaEl.textContent = "Updated " + data.updated + " \u2022 " + data.timezone;
  }

  function stat(label, value) {
    return (
      '<div class="nl-stat"><div class="nl-label">' +
      label +
      '</div><div class="nl-value">' +
      value +
      "</div></div>"
    );
  }

  render();
})();
</script>
