<!-- PowerSocket NEM Headroom Explorer: paste into a Ghost HTML card on the
     product's page. Subscribers only: the data comes from the private
     headroom service, which checks each visitor is a paying member.
     data-api   the service's address (the Vercel project for powersocket-grid-headroom)
     data-signup / data-upgrade   optional: where "Subscribe" and "See plans" go
                (default: Ghost Portal's sign-up and plans screens) -->
<div class="pshr" data-headroom-explorer
     data-api="SERVICE_URL"
     data-default="NWRK1W"></div>

<!-- The widget's JavaScript comes from the service (/api/widget), which
     serves nem_live's current headroom-widget.js with a 5-minute cache, so
     widget changes reach readers within minutes, with no re-paste. -->
<script src="SERVICE_URL/api/widget"></script>
