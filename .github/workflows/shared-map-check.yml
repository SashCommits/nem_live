name: Shared Power Socket map integration checks

on:
  pull_request:
    paths:
      - 'powersocket-map-core.js'
      - 'qld-substations-widget.js'
      - 'docs/shared-map-standard.md'
      - '.github/workflows/shared-map-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS syntax and keyless shared basemap
        run: |
          node --check powersocket-map-core.js
          node --check qld-substations-widget.js
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const core = fs.readFileSync('powersocket-map-core.js', 'utf8');
          const qld = fs.readFileSync('qld-substations-widget.js', 'utf8');
          if (/basemaps.cartocdn.com|apikey|required.*key=/i.test(core + qld)) throw Error('Unexpected key-restricted basemap');
          if (!qld.includes('PowerSocketMaps')) throw Error('QLD widget is not using the shared basemap');
          if (qld.includes('L.tileLayer')) throw Error('Old Leaflet raster tile path remains');
          const window = {matchMedia: () => ({matches:false})};
          const html = {theme:'light', getAttribute(x) {return x==='data-theme' ? this.theme : null;}};
          const document = {documentElement:html,body:{getAttribute(){return null;}}};
          vm.runInNewContext(core, {window,document,Promise,console});
          if (!window.PowerSocketMaps) throw Error('Shared map theme did not initialise');
          if (window.PowerSocketMaps.provider !== 'OpenFreeMap') throw Error('Wrong map provider');
          if (!window.PowerSocketMaps.styleUrl().includes('/positron')) throw Error('Wrong light style');
          html.theme = 'dark';
          if (!window.PowerSocketMaps.styleUrl().includes('/dark')) throw Error('Wrong dark style');
          console.log('Site-wide OpenFreeMap styles and Queensland map checks passed');
          JS

      - name: Verify public OpenFreeMap styles and pinned MapLibre runtime
        run: |
          python - <<'PY'
          import json
          import urllib.request
          urls = (
              "https://tiles.openfreemap.org/styles/positron",
              "https://tiles.openfreemap.org/styles/dark",
          )
          for url in urls:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers={"User-Agent": "ThePowerSocket-MapQA/1.0"}),
                  timeout=20
              ) as response:
                  obj = json.load(response)
              if obj.get("version") != 8 or not obj.get("sources") or not obj.get("layers"):
                  raise RuntimeError(f"OpenFreeMap unexpected vector style JSON: {url}")
              print(url, "valid style v8", len(obj["layers"]), "layers")
          url = "https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js"
          with urllib.request.urlopen(
              urllib.request.Request(url, headers={"User-Agent":"ThePowerSocket-MapQA/1.0"}),
              timeout=20
          ) as response:
              body = response.read(10000)
          if len(body) < 1000:
              raise RuntimeError("Pinned MapLibre JS UMD runtime missing")
          print("Pinned MapLibre GL JS v5.8.0 available")
          PY

      - name: Regression test cached widget recovering missing shared map core
        run: |
          node - <<'JS'
          const vm = require('node:vm');
          const fs = require('node:fs');
          const source = fs.readFileSync('qld-substations-widget.js','utf8');
          const begin = source.indexOf('  var MAP_CORE_FALLBACK');
          const end = source.indexOf('  function startQueenslandMap(maps)', begin);
          if (begin < 0 || end < 0) throw Error('Cannot find recovery loader');
          const scripts = [];
          const window = {};
          const context = vm.createContext({
            window, Promise, Error,
            el: () => ({}),
            document: {head:{appendChild(node){scripts.push(node)}}}
          });
          vm.runInContext(source.slice(begin,end),context);
          const promise = vm.runInContext('ensureMapCore()',context);
          if (scripts.length !== 1) throw Error('Missing core did not trigger a script request');
          if (!scripts[0].src.includes('@a3fef15e5b96d77f24c2cfa598fa5f8d2ad5080c/')) {
            throw Error('Fallback is not pinned to the actual map-core merge commit');
          }
          window.PowerSocketMaps = {provider:'OpenFreeMap'};
          scripts[0].onload();
          promise.then(value=>{
            if (value !== window.PowerSocketMaps) throw Error('Recovered wrong map module');
            return vm.runInContext('ensureMapCore()',context);
          }).then(value=>{
            if (scripts.length !== 1 || value.provider !== 'OpenFreeMap') throw Error('Recovered core not reused');
            console.log('Cached-widget map core recovery works');
          }).catch(error => {console.error(error);process.exitCode=1});
          JS
      - name: Verify version-pinned recovery module actually exists on CDN
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://cdn.jsdelivr.net/gh/SashCommits/nem_live@a3fef15e5b96d77f24c2cfa598fa5f8d2ad5080c/powersocket-map-core.js'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ThePowerSocket-MapQA/1.0'}),timeout=25) as r:
              content=r.read()
          assert b'PowerSocketMaps' in content and b'tiles.openfreemap.org' in content
          print('Pinned map recovery module publicly available:',len(content),'bytes')
          PY
