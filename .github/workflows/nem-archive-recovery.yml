name: NEM archived price recovery
on:
  pull_request:
    paths:
      - 'poller.py'
      - 'tests/test_archive_recovery.py'
      - '.github/workflows/nem-archive-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile poller and tests
        run: python -m py_compile poller.py tests/test_archive_recovery.py
      - name: Source-backed archive recovery tests
        run: python -m unittest discover -s tests -p 'test_archive_recovery.py' -v
