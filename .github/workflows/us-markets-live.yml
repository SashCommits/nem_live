name: US markets live data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Re-running an old run replays its original commit, so a code fix only
  # reaches the poller on a fresh run. Run on push so merges to main are
  # exercised immediately instead of waiting on the (best-effort) schedule.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # Only guards against two US-markets runs overlapping. nem-live.yml has
  # its own group: neither needs to lock the other out, because each poll
  # cycle below re-syncs with the data branch immediately before writing
  # (see the loop) and retries a rejected push rather than force-pushing (see the loop).
  group: us-markets-live
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # See nem-live.yml for why this loops instead of polling once: GitHub's
    # schedule trigger goes hours between actual firings in practice, so
    # each successful firing now covers most of a runner's 6h budget itself.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-us.txt

      - name: Poll ERCOT and publish every ~5 minutes for the rest of the job
        run: |
          git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" store || (mkdir -p store && cd store && git init -q -b data)
          cd store
          [ -f .gitignore ] || echo "nemosis_cache/" > .gitignore
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          cd ..

          end=$((SECONDS + 335*60))
          while [ $SECONDS -lt $end ]; do
            cycle_start=$SECONDS
            # nem-live.yml may have pushed its own files since our last
            # cycle; sync first so our push only adds ours, instead of a
            # stale full-tree force-push wiping theirs out.
            (cd store && git fetch -q --depth 1 origin data && git reset -q --hard origin/data) || true
            timeout 180 python us_poller.py --once --data store/ercot --out store/public/ercot || echo "poll cycle failed, will retry next cycle"
            cd store
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name="nem-live" -c user.email="nem-live@users.noreply.github.com" commit -qm "Update US markets $(date -u +%FT%TZ)"
              # nem-live.yml and us-markets-live.yml both push to this branch
              # every few minutes, so pushes occasionally collide (GitHub then
              # rejects one, e.g. "fatal error in commit_refs"). Replay our
              # commit on the latest data branch and retry, rather than
              # force-pushing over the other workflow's commit, and never let
              # one rejected push kill the whole multi-hour loop.
              pushed=false
              for attempt in 1 2 3; do
                if git push -q origin data; then pushed=true; break; fi
                sleep $((attempt * 5))
                git fetch -q --depth 20 origin data && git -c user.name="nem-live" -c user.email="nem-live@users.noreply.github.com" rebase -q origin/data || { git rebase --abort 2>/dev/null; break; }
              done
              if [ "$pushed" != true ]; then
                echo "::warning::Couldn't push this cycle; re-syncing and publishing again next cycle"
                git fetch -q --depth 1 origin data && git reset -q --hard origin/data || true
              fi
            fi
            cd ..
            elapsed=$((SECONDS - cycle_start))
            sleep $((elapsed < 270 ? 270 - elapsed : 5))
          done
